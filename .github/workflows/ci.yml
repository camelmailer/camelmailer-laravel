name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.1"
            laravel: "10"
            testbench: "^8.22"
          - php: "8.2"
            laravel: "10"
            testbench: "^8.22"
          - php: "8.2"
            laravel: "11"
            testbench: "^9.0"
          - php: "8.3"
            laravel: "11"
            testbench: "^9.0"
          - php: "8.3"
            laravel: "12"
            testbench: "^10.0"
          - php: "8.4"
            laravel: "12"
            testbench: "^10.0"
          - php: "8.3"
            laravel: "13"
            testbench: "^11.0"
          - php: "8.4"
            laravel: "13"
            testbench: "^11.0"
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Lint
        run: composer lint

      - name: Static analysis
        run: composer analyse

      - name: Tests
        run: composer test
